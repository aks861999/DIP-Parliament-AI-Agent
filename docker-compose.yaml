# docker-compose.yaml
# Four containers: postgres, redis, mcp-server, agent-app, talking over a
# plain Docker bridge network. mcp-server/agent-app use SSE instead of
# stdio when containerized. No orchestrator beyond docker compose — no
# Kubernetes anywhere. This is a required deliverable for production, but
# the primary way to run this project day-to-day is the *_setup_and_run.sh
# scripts against natively-installed or `docker compose up postgres redis`
# Postgres/Redis (see README.md).
#
# Run with: docker compose up --build
services:
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
    - "5432:5432"
    volumes:
      - ./volumes/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - dip-agent

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - ./volumes/redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - dip-agent

  mcp-server:
    build:
      context: ./services/mcp-server
    environment:
      - DIP_API_BASE_URL=${DIP_API_BASE_URL}
      - DIP_API_KEY=${DIP_API_KEY}
      - MCP_CACHE_TTL_SECONDS=${MCP_CACHE_TTL_SECONDS}
      - REDIS_URL=redis://redis:6379/1
      - MCP_TRANSPORT=${MCP_TRANSPORT}
      - LOG_LEVEL=${LOG_LEVEL}
      - PREWARM_ON_STARTUP=${PREWARM_ON_STARTUP}
      - NAME_DIRECTORY_TTL_SECONDS=${NAME_DIRECTORY_TTL_SECONDS}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - dip-agent



  agent-service:
    build:
      context: ./services/agent-service
    environment:
      - LLM_MODEL=${LLM_MODEL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_REQUESTS_PER_MINUTE=${LLM_REQUESTS_PER_MINUTE}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES}
      - MAX_REFLECTION_ITERATIONS=${MAX_REFLECTION_ITERATIONS}
      - ENABLE_REFLECTION=${ENABLE_REFLECTION}
      - ENABLE_HALLUCINATION_GUARD=${ENABLE_HALLUCINATION_GUARD}
      - FAITHFULNESS_THRESHOLD=${FAITHFULNESS_THRESHOLD}
      - COMPLETENESS_THRESHOLD=${COMPLETENESS_THRESHOLD}
      - MCP_TRANSPORT=${MCP_TRANSPORT}
      - AGENT_QUERY_TIMEOUT_SECONDS=${AGENT_QUERY_TIMEOUT_SECONDS}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_HOST=${LANGFUSE_HOST}
    depends_on:
      postgres:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dip-agent

  agent-app:
    build:
      context: ./services/agent-app
    ports:
      - "8501:8501"
    environment:
      - AGENT_SERVICE_URL=http://agent-service:8000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      agent-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dip-agent

networks:
  dip-agent:
    name: dip-agent
    driver: bridge

# Note: agent-app's DATABASE_URL here points at the postgres service by
# container name (postgres:5432), not localhost — different from the
# native/non-Docker .env value, which points at localhost:5432. This is
# the normal Docker-networking distinction, not an inconsistency; use
# whichever DATABASE_URL matches how you're actually running things.


